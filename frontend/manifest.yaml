apiVersion: apps/v1
kind: deployment
metadata: 
    name: frontend
    namespace: roboshop  # name space where the pod is going to be created
    # these are replica-set labels. 
    labels: 
        project: roboshop 
        component: frontend 
        environment: dev
        tier: frontend 
        purpose: deployment
spec:
    replicas: 1
    selector:
        #This is used to select the pods and create the replicaset for those pods. 
        matchLabels:
            project: roboshop 
            component: frontend 
            environment: dev
            tier: frontend   
            purpose: deployment
        
    template: 
        metadata: 
            labels: 
                project: roboshop 
                component: frontend 
                environment: dev
                tier: frontend   
                purpose: deployment
        spec: 
            containers: 
                - name: frontend 
                  image: joindevops/frontend:v1  # it should be there in our docker hub
                  imagePullPolicy: Always
                  ports:
                  - name: liveness-port
                    containerPort: 80
                  readinessProbe:
                      httpGet:
                      port: liveness-port
                      path: /
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      failureThreshold: 2
                      successThreshold: 1 
                  livenessProbe:
                      httpGet:
                      port: liveness-port
                      path: /
                      initialDelaySeconds: 8
                      periodSeconds: 4
                      failureThreshold: 2
                      successThreshold: 1 
#-----------------------------------------
#Creating a service for the mongodb pod
apiVersion: v1
kind: service
metadata: 
    name: frontend
    namespace: roboshop  # name space where the pod is going to be created
    # these are service labels. 
spec:
    type: LoadBalancer
    selector: 
        project: roboshop 
        component: frontend 
        environment: dev
        tier: frontend
        purpose: service
    ports:
        - protocol: TCP 
          port: 80 #service port, which can be anything
          targetPort: 80 #pod port, which should match the container port